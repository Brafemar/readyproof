<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>readyproof · Mi cuenta</title><link rel="stylesheet" href="/static/carga.css"><link rel="stylesheet" href="/static/cuenta.css"></head><body class="access-page"><main class="access-card"><a class="brand" href="/"><span class="brand-symbol">rp</span><span>readyproof</span></a><h1>Mi cuenta</h1><p>{{ usuario.nombre }} · {{ usuario.login }} · {{ usuario.rol }}</p><h2>Cambiar contraseña</h2><p>Se cerrarán todas tus sesiones. Los borradores locales quedan reservados a esta cuenta hasta que vuelvas a ingresar.</p>{% if error %}<p class="message" role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf }}"><div class="field"><label for="actual">Contraseña actual</label><input type="password" name="actual" id="actual" autocomplete="current-password" required></div><div class="field"><label for="nueva">Nueva contraseña</label><input type="password" name="nueva" id="nueva" autocomplete="new-password" minlength="12" required></div><div class="field"><label for="confirmacion">Repetir nueva contraseña</label><input type="password" name="confirmacion" id="confirmacion" autocomplete="new-password" minlength="12" required></div><button class="button primary" type="submit">Cambiar contraseña</button><a class="button secondary" href="/">Volver a planillas</a></form></main></body></html>
